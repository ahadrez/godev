apiVersion: apps/v1
kind: Deployment
metadata:
  name: godev
  namespace: godev
  labels:
    app: godev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: godev
  template:
    metadata:
      labels:
        app: godev
    spec:
      containers:
        - name: godev
          # Tag is injected by kustomize (see kustomization.yaml images)
          image: us-central1-docker.pkg.dev/udc-cloud-architect-poc/godev/godev
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: godev-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
