apiVersion: apps/v1
kind: Deployment
metadata:
  name: godev
  namespace: godev
  labels:
    app: godev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: godev
  template:
    metadata:
      labels:
        app: godev
    spec:
      # KSA bound to Secret Manager IAM via Workload Identity Federation
      serviceAccountName: godev
      containers:
        - name: godev
          # Tag is injected by kustomize (see kustomization.yaml images)
          image: us-central1-docker.pkg.dev/udc-cloud-architect-poc/godev/godev
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: godev-config
          volumeMounts:
            # tmpfs mount populated by the Secrets Store CSI driver;
            # the secret never touches etcd or a Kubernetes Secret
            - name: gcp-secrets
              mountPath: /var/secrets
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: gcp-secrets
          csi:
            # GKE built-in add-on driver; on OpenShift: secrets-store.csi.k8s.io
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: godev-secrets
