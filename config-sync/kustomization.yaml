apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - secretproviderclass.yaml

# Generated with a content-hash name suffix: any change here renames the
# ConfigMap, which changes the pod template and rolls the pods automatically.
configMapGenerator:
  - name: godev-config
    namespace: godev
    literals:
      # Environment name shown on the app page: development | test | production
      - APP_ENV=production
      # Where the CSI driver mounts the demo secret (see secretproviderclass.yaml)
      - SECRET_FILE=/var/secrets/godev-demo

# Image tag pinned by CI (cloudbuild.yaml update-manifests step)
images:
  - name: us-central1-docker.pkg.dev/udc-cloud-architect-poc/godev/godev
    newTag: "708f51c"
