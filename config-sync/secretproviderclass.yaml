# Maps GCP Secret Manager secrets to files for the godev pod.
# Uses the GKE built-in Secret Manager add-on (provider: gke), required on
# Autopilot where the self-installed CSI driver's privileged DaemonSet is
# blocked. On on-prem OpenShift this becomes the self-installed driver:
#   provider: gcp, and the pod volume driver: secrets-store.csi.k8s.io
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: godev-secrets
  namespace: godev
  labels:
    app: godev
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/udc-cloud-architect-poc/secrets/godev-demo/versions/latest"
        path: "godev-demo"
