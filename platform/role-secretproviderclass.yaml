# The built-in 'admin' ClusterRole does not cover CRDs like
# SecretProviderClass, so the app team's RepoSync reconciler needs this
# extra grant to sync config-sync/secretproviderclass.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secretproviderclass-admin
  namespace: godev
rules:
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: repo-sync-secretproviderclass
  namespace: godev
subjects:
  - kind: ServiceAccount
    name: ns-reconciler-godev
    namespace: config-management-system
roleRef:
  kind: Role
  name: secretproviderclass-admin
  apiGroup: rbac.authorization.k8s.io
