# Google Secret Manager provider for the Secrets Store CSI driver.
# Based on upstream deploy/provider-gcp-plugin.yaml, adapted for OpenShift:
# sandbox namespace, /var/run socket dir (matches the Red Hat driver),
# UBI init image, keyless WIF credentials (ConfigMap csi-wif is created by
# 2-openshift-deploy.sh from the credentials.json that 1-gcp-setup.sh wrote).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-store-csi-driver-provider-gcp
  namespace: ucod-hadrezak-sandbox
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-secrets-store-provider-gcp
  namespace: ucod-hadrezak-sandbox
  labels:
    app: csi-secrets-store-provider-gcp
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: csi-secrets-store-provider-gcp
  template:
    metadata:
      labels:
        app: csi-secrets-store-provider-gcp
    spec:
      serviceAccountName: secrets-store-csi-driver-provider-gcp
      hostNetwork: false
      hostPID: false
      hostIPC: false
      initContainers:
        # upstream uses busybox; UBI avoids docker.io pulls on OpenShift
        - name: chown-provider-mount
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["chown", "1000:1000", "/var/run/secrets-store-csi-providers"]
          volumeMounts:
            - mountPath: /var/run/secrets-store-csi-providers
              name: providervol
      containers:
        - name: provider
          # upstream-pinned image; mirror internally if external pulls are blocked
          image: us-docker.pkg.dev/secretmanager-csi/secrets-store-csi-driver-provider-gcp/plugin@sha256:d75de980398bf14f07088ac36dea472b7b4d4cdc11b6335723020cc6ab0c8c28
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            # where the provider creates its socket; the RH driver watches this
            # dir. If mounts fail with "provider not found", check the driver
            # pods' --provider-volume path and align (upstream GKE manifests
            # use /etc/kubernetes/secrets-store-csi-providers instead).
            - name: TARGET_DIR
              value: /var/run/secrets-store-csi-providers
            # keyless auth: external_account config + projected, rotating token
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/wif/credentials.json
          volumeMounts:
            - mountPath: /var/run/secrets-store-csi-providers
              name: providervol
              mountPropagation: None
              readOnly: false
            - mountPath: /var/run/wif
              name: wif
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { cpu: 50m, memory: 100Mi }
          livenessProbe:
            httpGet: { path: /live, port: 8095 }
            initialDelaySeconds: 5
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: providervol
          hostPath:
            path: /var/run/secrets-store-csi-providers
        - name: wif
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://ocp-csi-poc.example.invalid   # = WIF --allowed-audiences in 1-gcp-setup.sh
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: csi-wif
                  items:
                    - key: credentials.json
                      path: credentials.json
      nodeSelector:
        kubernetes.io/os: linux
