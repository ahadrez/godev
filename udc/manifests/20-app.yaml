# goapp-sm: reads the CSI-mounted secret and shows a masked status card on its
# web page (never the value itself). Exposed via an edge-TLS Route.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: csi-poc
  namespace: ucod-hadrezak-sandbox
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/udc-d-30049622-stella-1/secrets/csi-poc-password/versions/latest"
        path: "password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goapp-sm
  namespace: ucod-hadrezak-sandbox
  labels:
    app: goapp-sm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goapp-sm
  template:
    metadata:
      labels:
        app: goapp-sm
    spec:
      containers:
        - name: goapp-sm
          image: quay.io/upstream/goapp-sm
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: openshift-poc
            # the app reads this file and renders Loaded/Not mounted + masked value
            - name: SECRET_FILE
              value: /mnt/secrets/password
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: csi-poc
---
apiVersion: v1
kind: Service
metadata:
  name: goapp-sm
  namespace: ucod-hadrezak-sandbox
  labels:
    app: goapp-sm
spec:
  selector:
    app: goapp-sm
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: goapp-sm
  namespace: ucod-hadrezak-sandbox
  labels:
    app: goapp-sm
spec:
  to:
    kind: Service
    name: goapp-sm
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
